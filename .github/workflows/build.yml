name: Build Bereton

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract zip
        run: |
          ZIP=$(find . -maxdepth 1 -name "*.zip" | head -1)
          if [ -z "$ZIP" ]; then
            echo "No zip found."
            exit 0
          fi
          unzip -o "$ZIP"
          for DIR in bereton-fixed bereton; do
            if [ -d "$DIR" ]; then
              cp -rn "$DIR/." .
              break
            fi
          done

      - name: Fix gradlew
        run: |
          cat > gradlew << 'WRAPPER'
          #!/bin/sh
          APP_HOME="$(pwd -P)"
          CLASSPATH="$APP_HOME/gradle/wrapper/gradle-wrapper.jar"
          if [ -n "$JAVA_HOME" ]; then
            JAVACMD="$JAVA_HOME/bin/java"
          else
            JAVACMD="java"
          fi
          exec "$JAVACMD" -Xmx64m -Xms64m \
            "-Dorg.gradle.appname=gradlew" \
            -classpath "$CLASSPATH" \
            org.gradle.wrapper.GradleWrapperMain \
            "$@"
          WRAPPER
          chmod +x gradlew

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Download gradle wrapper jar
        run: |
          mkdir -p gradle/wrapper
          curl -sL "https://github.com/gradle/gradle/raw/v8.11.0/gradle/wrapper/gradle-wrapper.jar" \
            -o gradle/wrapper/gradle-wrapper.jar

      - name: Build
        run: ./gradlew build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: bereton-jar
          path: build/libs/bereton-*.jar
          if-no-files-found: error
